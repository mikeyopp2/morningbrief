<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Upload</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;line-height:1.4}
label{display:block;margin:14px 0 4px;font-weight:600}
input[type=text],input[type=password]{width:100%;padding:10px;font-size:16px;box-sizing:border-box}
button{margin-top:16px;padding:12px 20px;font-size:16px}
#log{margin-top:16px;white-space:pre-wrap;font-size:14px}
small{color:#666}
</style></head><body>
<h1>Upload a file</h1>
<label for="tok">GitHub token</label>
<input id="tok" type="password" autocomplete="off" placeholder="fine-grained token, Contents: read/write">
<small>Kept only for this browser tab. This is what keeps the page private: without a valid token, nothing can be uploaded.</small>
<label for="dir">Folder in repo</label>
<input id="dir" type="text" value="uploads">
<label for="f">File</label>
<input id="f" type="file">
<button id="go">Upload</button>
<div id="log"></div>
<script>
const REPO="mikeyopp2/morningbrief", BRANCH="main";
const $=id=>document.getElementById(id), log=m=>$("log").textContent=m;
try{$("tok").value=sessionStorage.getItem("tok")||""}catch(e){}
$("go").onclick=async()=>{
  const tok=$("tok").value.trim(), file=$("f").files[0];
  if(!tok||!file){log("Enter a token and choose a file.");return}
  try{sessionStorage.setItem("tok",tok)}catch(e){}
  if(file.size>25*1024*1024){log("File too large (25 MB max).");return}
  const dir=$("dir").value.trim().replace(/^\/+|\/+$/g,"");
  const path=(dir?dir+"/":"")+file.name.replace(/[^\w.\- ]/g,"_");
  log("Reading file…");
  const bytes=new Uint8Array(await file.arrayBuffer());
  let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  const url=`https://api.github.com/repos/${REPO}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  let sha;
  const ex=await fetch(url+"?ref="+BRANCH,{headers:h});
  if(ex.ok){sha=(await ex.json()).sha;if(!confirm(path+" exists. Overwrite?")){log("Cancelled.");return}}
  log("Uploading…");
  const r=await fetch(url,{method:"PUT",headers:h,body:JSON.stringify({message:"Upload "+path,content:btoa(bin),branch:BRANCH,sha})});
  const j=await r.json();
  log(r.ok?"Uploaded: "+j.content.html_url:"Failed ("+r.status+"): "+(j.message||""));
};
</script></body></html>
