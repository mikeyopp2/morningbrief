<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Joust</title>
<style>
:root{--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--bg:#faf8f4;--card:#fff;--accent:#8a3b26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;max-width:900px;padding:16px 20px;border-bottom:2px solid var(--ink);text-align:center}
header h1{margin:0;font-size:28px;color:var(--accent)}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
nav{margin-top:10px;font-size:14px}
nav a{color:var(--muted);margin:0 12px;text-decoration:none}
nav a:hover{color:var(--accent)}
#game-wrap{margin:20px auto;position:relative}
canvas{background:#e8e4dc;border:2px solid var(--ink);border-radius:8px;display:block;max-width:100%;touch-action:none}
#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:600;font-size:18px;pointer-events:none;text-shadow:1px 1px 2px #fff}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(250,248,244,.92);font-size:24px;font-weight:700;color:var(--accent);text-align:center;padding:20px}
footer{margin-top:auto;padding:16px;font-size:13px;color:var(--muted);text-align:center}
button{margin-top:12px;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>⚔️ Mini Joust</h1>
<p>Control your knight • Time your lance • Unhorse the opponent</p>
nav><a href="index.html">Morning Brief</a> <a href="archive.html">Archive</a> <a href="joust.html">Joust</a></nav>
</header>

<div id="game-wrap">
<canvas id="c" width="800" height="420"></canvas>
<div id="ui"><span id="score">You: 0 – AI: 0</span><span id="round">Round 1</span></div>
<div id="message">Click or press Space to start<br><small style="font-weight:400;font-size:16px">Up/Down arrows or mouse to aim height</small></div>
</div>

<footer>A tiny jousting game for canihelpyou.work • Pure JavaScript • No libraries</footer>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('message');
const scoreEl = document.getElementById('score');
const roundEl = document.getElementById('round');

let running = false;
let playerY = 180;
let aiY = 180;
let charge = 0; // 0 to 1 progress of the charge
let playerLance = false;
let aiLance = false;
let playerScore = 0;
let aiScore = 0;
let round = 1;
let result = '';
let keys = {};

function drawKnight(x, y, color, facing, lanceOut, isPlayer) {
  ctx.save();
  ctx.translate(x, y);
  if (facing < 0) ctx.scale(-1, 1);

  // Horse body
  ctx.fillStyle = color === 'blue' ? '#4a6fa5' : '#a54a4a';
  ctx.beginPath();
  ctx.ellipse(0, 30, 55, 22, 0, 0, Math.PI*2);
  ctx.fill();

  // Legs (simple)
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-25, 48); ctx.lineTo(-30, 75);
  ctx.moveTo(25, 48); ctx.lineTo(30, 75);
  ctx.stroke();

  // Knight body
  ctx.fillStyle = color === 'blue' ? '#2c4a7c' : '#7c2c2c';
  ctx.fillRect(-18, -20, 36, 50);

  // Helmet
  ctx.beginPath();
  ctx.arc(0, -28, 16, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ddd';
  ctx.fillRect(-8, -32, 16, 8);

  // Shield
  ctx.fillStyle = color === 'blue' ? '#6a9bd1' : '#d16a6a';
  ctx.beginPath();
  ctx.moveTo(facing > 0 ? 22 : -22, -5);
  ctx.lineTo(facing > 0 ? 38 : -38, 5);
  ctx.lineTo(facing > 0 ? 32 : -32, 25);
  ctx.lineTo(facing > 0 ? 12 : -12, 18);
  ctx.closePath();
  ctx.fill();

  // Lance
  if (lanceOut) {
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(facing > 0 ? 20 : -20, -10);
    ctx.lineTo(facing > 0 ? 120 : -120, -5);
    ctx.stroke();
    // Tip
    ctx.fillStyle = '#ccc';
    ctx.beginPath();
    ctx.moveTo(facing > 0 ? 120 : -120, -5);
    ctx.lineTo(facing > 0 ? 135 : -135, -8);
    ctx.lineTo(facing > 0 ? 120 : -120, -2);
    ctx.fill();
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground
  ctx.fillStyle = '#8b7355';
  ctx.fillRect(0, 340, canvas.width, 80);
  ctx.fillStyle = '#6b5b45';
  ctx.fillRect(0, 340, canvas.width, 8);

  // Stands / background hints
  ctx.fillStyle = '#ddd6cc';
  ctx.fillRect(40, 80, 120, 100);
  ctx.fillRect(640, 80, 120, 100);
  ctx.fillStyle = '#c9c0b4';
  ctx.fillRect(50, 90, 100, 70);
  ctx.fillRect(650, 90, 100, 70);

  const progress = Math.min(charge, 1);
  const px = 120 + progress * 280;
  const ax = 680 - progress * 280;

  drawKnight(px, playerY, 'blue', 1, playerLance && progress > 0.55, true);
  drawKnight(ax, aiY, 'red', -1, aiLance && progress > 0.55, false);

  // Collision check visual (optional)
  if (progress > 0.7 && playerLance && Math.abs(playerY - aiY) < 40) {
    ctx.fillStyle = 'rgba(255,220,0,0.3)';
    ctx.beginPath();
    ctx.arc((px + ax)/2, (playerY + aiY)/2, 30, 0, Math.PI*2);
    ctx.fill();
  }
}

function update() {
  if (!running) return;

  // Player control
  if (keys['ArrowUp'] || keys['w'] || keys['W']) playerY = Math.max(80, playerY - 4);
  if (keys['ArrowDown'] || keys['s'] || keys['S']) playerY = Math.min(280, playerY + 4);

  // Simple AI
  const target = playerY + (Math.random()-0.5)*30;
  aiY += (target - aiY) * 0.08;
  aiY = Math.max(80, Math.min(280, aiY));

  // Charge progress
  charge += 0.008;
  if (charge > 0.6 && !playerLance && Math.random() < 0.02) aiLance = true;

  if (charge >= 1) {
    // Resolve hit
    const heightDiff = Math.abs(playerY - aiY);
    let pHit = playerLance && heightDiff < 45;
    let aHit = aiLance && heightDiff < 50;

    if (pHit && !aHit) {
      playerScore++;
      result = 'Hit! You scored!';
    } else if (aHit && !pHit) {
      aiScore++;
      result = 'You were hit!';
    } else if (pHit && aHit) {
      result = 'Both hit — draw this pass';
    } else {
      result = 'Both missed';
    }

    scoreEl.textContent = `You: ${playerScore} – AI: ${aiScore}`;
    running = false;
    msg.innerHTML = result + '<br><button onclick="nextRound()">Next Round</button>';
    msg.style.display = 'flex';
    return;
  }

  draw();
  requestAnimationFrame(update);
}

function start() {
  running = true;
  charge = 0;
  playerLance = false;
  aiLance = false;
  playerY = 160 + Math.random()*80;
  aiY = 160 + Math.random()*80;
  result = '';
  msg.style.display = 'none';
  roundEl.textContent = `Round ${round}`;
  draw();
  update();
}

function nextRound() {
  round++;
  start();
}

function toggleLance() {
  if (running && charge > 0.3 && charge < 0.85) playerLance = true;
}

canvas.addEventListener('mousemove', e => {
  if (!running) return;
  const rect = canvas.getBoundingClientRect();
  const scaleY = canvas.height / rect.height;
  playerY = (e.clientY - rect.top) * scaleY - 40;
  playerY = Math.max(80, Math.min(280, playerY));
});

canvas.addEventListener('click', toggleLance);
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (!running) start();
    else toggleLance();
  }
});
window.addEventListener('keyup', e => keys[e.key] = false);

msg.addEventListener('click', () => { if (!running) start(); });

draw();
</script>
</body>
</html>
